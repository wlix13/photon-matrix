name: 🔍 Check code quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: 🔍 Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24

      - run: npm ci

      - name: Run type check
        run: npm run typecheck

  build:
    name: 📦 Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24

      - run: npm ci

      - name: Check the bundle
        run: npx wrangler deploy --dry-run --outdir dist

  quality-gate:
    name: ✅ Code quality passed
    if: always()
    needs: [typecheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if typecheck or build job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::typecheck or build job failed or was cancelled"
          exit 1
