version: 1
labels:
  # --- by PR "Type of change" checklist ---
  - label: "feature"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Feature\b'
  - label: "bug"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Bug fix\b'
  - label: "enhancement"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Enhancement\b'
  - label: "refactor"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Refactor\b'
  - label: "breaking-change"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Breaking change\b'
  - label: "security"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Security\b'

  # --- by changed paths ---
  - label: "docs"
    files:
      - "^README\\.md$"
  - label: "ci-cd"
    files:
      - "^\\.github/"
  - label: "dependencies"
    files:
      - "^package-lock\\.json$"
  - label: "federation"
    files:
      - "^src/api/federation\\.ts$"
      - "^src/consumers/federation-consumer\\.ts$"
      - "^src/services/federation-sender\\.ts$"
      - "^src/services/federation-keys\\.ts$"
      - "^src/middleware/federation-auth\\.ts$"
  - label: "e2ee"
    files:
      - "^src/api/keys\\.ts$"
      - "^src/api/key-backups\\.ts$"
      - "^src/crypto/"
  - label: "auth"
    files:
      - "^src/api/oidc-auth\\.ts$"
      - "^src/api/oauth\\.ts$"
      - "^src/api/admin\\.ts$"
      - "^src/services/oidc-keys\\.ts$"
      - "^src/admin/"
  - label: "sync"
    files:
      - "^src/api/sync\\.ts$"
      - "^src/api/sliding-sync\\.ts$"
      - "^src/durable-objects/SyncDurableObject\\.ts$"
      - "^src/services/sync-wait\\.ts$"
  - label: "media"
    files:
      - "^src/api/media\\.ts$"
      - "^src/services/media-federation\\.ts$"
  - label: "rooms"
    files:
      - "^src/api/rooms\\.ts$"
      - "^src/durable-objects/RoomDurableObject\\.ts$"
      - "^src/services/room-cache\\.ts$"
      - "^src/services/room-versions\\.ts$"
